# Runtime modules jlink must keep. Derived from the former module-info.java
# requires clauses, minus javafx.* (JavaFX now comes from the classpath) and
# plus jdk.unsupported, which javafx.graphics used to pull in transitively.
# Single source for the Gradle build, the workflows and the AUR PKGBUILDs.
jpackageAddModules=java.desktop,java.net.http,java.sql,jdk.crypto.ec,jdk.jsobject,jdk.net,jdk.xml.dom,jdk.unsupported

org.gradle.parallel=true
org.gradle.caching=true
